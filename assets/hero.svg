  <radialGradient id="cyan"><stop stop-color="#22D3EE" stop-opacity="0.13"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.75" fill="#A5B4FC" fill-opacity="0.13"/></pattern>
</defs>
