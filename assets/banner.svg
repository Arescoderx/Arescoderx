      <g fill="#445373" font-size="12"><text x="23" y="87">01</text><text x="23" y="120">02</text><text x="23" y="153">03</text><text x="23" y="186">04</text><text x="23" y="219">05</text></g>
      <text x="61" y="87"><tspan fill="#a78bfa">const</tspan> perfil = {</text>
      <text x="80" y="120">foco: <tspan fill="#67e8f9">'Full Stack'</tspan>,</text>
      <text x="80" y="153">origem: <tspan fill="#67e8f9">'Espírito Santo'</tspan>,</text>
