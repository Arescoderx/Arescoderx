<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
<title id="title">Matheus Schmidt — Desenvolvedor Full Stack em formação</title>
<desc id="description">Banner com nome em destaque, monograma MS, órbitas animadas e um terminal. Espírito Santo, Brasil. Curso técnico de Análise e Desenvolvimento de Sistemas no SENAI.</desc>
<defs>
